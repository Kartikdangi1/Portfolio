<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Inter, system-ui, sans-serif"><rect width="960" height="540" fill="#0c0b0a"/><text x="40" y="52" font-size="13" fill="#5fb8c0" font-family="monospace" letter-spacing="1.5">WHAT SINEW PROVIDES</text><rect x="40" y="90" width="400" height="106" rx="12" fill="#141210" stroke="#2f8a94" stroke-width="1.5"/><rect x="40" y="90" width="6" height="106" rx="3" fill="#124d54"/><text x="66" y="132" font-size="20" font-weight="600" fill="#f1efe9">Motion planning</text><text x="66" y="158" font-size="13.5" fill="#a8a29a">~3,000 lines: MoveIt services, joint +</text><text x="66" y="176" font-size="13.5" fill="#a8a29a">Cartesian, FK/IK, multi-robot</text><rect x="480" y="90" width="400" height="106" rx="12" fill="#141210" stroke="#2f8a94" stroke-width="1.5"/><rect x="480" y="90" width="6" height="106" rx="3" fill="#124d54"/><text x="506" y="132" font-size="20" font-weight="600" fill="#f1efe9">Trajectory bridges</text><text x="506" y="158" font-size="13.5" fill="#a8a29a">pybind11 → MoveIt 2 TOTG + Ruckig</text><text x="506" y="176" font-size="13.5" fill="#a8a29a">jerk-limited smoothing</text><rect x="40" y="220" width="400" height="106" rx="12" fill="#141210" stroke="#2f8a94" stroke-width="1.5"/><rect x="40" y="220" width="6" height="106" rx="3" fill="#124d54"/><text x="66" y="262" font-size="20" font-weight="600" fill="#f1efe9">Servo lifecycle</text><text x="66" y="288" font-size="13.5" fill="#a8a29a">start / pause / resume / stop MoveIt Servo;</text><text x="66" y="306" font-size="13.5" fill="#a8a29a">jog, twist, pose</text><rect x="480" y="220" width="400" height="106" rx="12" fill="#141210" stroke="#2f8a94" stroke-width="1.5"/><rect x="480" y="220" width="6" height="106" rx="3" fill="#124d54"/><text x="506" y="262" font-size="20" font-weight="600" fill="#f1efe9">Force control</text><text x="506" y="288" font-size="13.5" fill="#a8a29a">~2,600 lines: admittance + compliance, stop</text><text x="506" y="306" font-size="13.5" fill="#a8a29a">detection</text><rect x="40" y="350" width="400" height="106" rx="12" fill="#141210" stroke="#2f8a94" stroke-width="1.5"/><rect x="40" y="350" width="6" height="106" rx="3" fill="#124d54"/><text x="66" y="392" font-size="20" font-weight="600" fill="#f1efe9">Gripper clients</text><text x="66" y="418" font-size="13.5" fill="#a8a29a">Franka, OnRobot ×2, Schunk Co-act behind one</text><text x="66" y="436" font-size="13.5" fill="#a8a29a">interface</text><rect x="480" y="350" width="400" height="106" rx="12" fill="#141210" stroke="#2f8a94" stroke-width="1.5"/><rect x="480" y="350" width="6" height="106" rx="3" fill="#124d54"/><text x="506" y="392" font-size="20" font-weight="600" fill="#f1efe9">ROS 2 utilities</text><text x="506" y="418" font-size="13.5" fill="#a8a29a">executors, parameters, scene + controllers,</text><text x="506" y="436" font-size="13.5" fill="#a8a29a">Euler/quat/affine</text><text x="40" y="510" font-size="12.5" fill="#6b665f">16 runnable examples · numpy-style docstrings + type annotations enforced by a pre-commit hook</text></svg>