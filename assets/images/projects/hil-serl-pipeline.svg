<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <defs>
    <pattern id="grid-hil" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 L0 0 0 16" fill="none" stroke="#ff5d3d" stroke-width="0.4" opacity="0.16" />
    </pattern>
    <marker id="arrow-hil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ff8a3d" />
    </marker>
  </defs>
  <rect width="320" height="200" fill="#12141b" />
  <rect width="320" height="200" fill="url(#grid-hil)" />

  <g stroke="#ff8a3d" stroke-width="1" fill="none" opacity="0.5">
    <path d="M10 10 L10 22 M10 10 L22 10" />
    <path d="M310 10 L310 22 M310 10 L298 10" />
  </g>

  <text x="18" y="22" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5" letter-spacing="0.5" fill="#ffe4d6" opacity="0.85">SAC POLICY + HUMAN-IN-THE-LOOP RL</text>

  <!-- POLICY -->
  <rect x="113" y="36" width="94" height="44" rx="4" fill="none" stroke="#ffb38a" stroke-width="1.3" />
  <text x="160" y="56" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#ffe4d6">POLICY</text>
  <text x="160" y="70" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7" fill="#c9a690">SAC · HG-DAGGER</text>

  <!-- ENV -->
  <rect x="16" y="104" width="100" height="44" rx="4" fill="none" stroke="#ffb38a" stroke-width="1.3" />
  <text x="66" y="124" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#ffe4d6">ENV</text>
  <text x="66" y="138" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7" fill="#c9a690">MUJOCO PANDA</text>

  <!-- REPLAY -->
  <rect x="204" y="104" width="100" height="44" rx="4" fill="none" stroke="#ffb38a" stroke-width="1.3" />
  <text x="254" y="124" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#ffe4d6">REPLAY</text>
  <text x="254" y="138" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7" fill="#c9a690">RLPD DUAL-BUFFER</text>

  <!-- loop arrows -->
  <path d="M108 104 L128 80" fill="none" stroke="#ff8a3d" stroke-width="1.2" marker-end="url(#arrow-hil)" />
  <path d="M192 80 L212 104" fill="none" stroke="#ff8a3d" stroke-width="1.2" marker-end="url(#arrow-hil)" />
  <path d="M204 126 L116 126" fill="none" stroke="#ff8a3d" stroke-width="1.2" marker-end="url(#arrow-hil)" />
</svg>
